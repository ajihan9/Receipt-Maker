[theme]
# 메인 포인트 컬러 (버튼 등) - 영수증 잉크색인 검은색으로 설정
primaryColor = "#000000"

# 전체 배경색 - 갱지나 영수증 종이 느낌이 나는 아주 옅은 회색
backgroundColor = "#f4f4f9"

# 입력창 등의 배경색 - 완전한 흰색
secondaryBackgroundColor = "#ffffff"

# 글자색 - 검은색
textColor = "#000000"

# 폰트 스타일 - 영수증 특유의 타자기 느낌을 위해 고정폭(monospace) 폰트 적용
font = "monospace"

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>가상 영수증 제조기</title>
    <style>
        /* [1] CSS 구역: 영수증 디자인을 담당합니다 */
        body { 
            font-family: 'Courier New', Courier, monospace; /* 영수증 느낌의 폰트 */
            background-color: #f4f4f9; 
            text-align: center; 
            padding: 20px;
        }
        .receipt-container { 
            background: white; 
            width: 300px; 
            margin: 20px auto; 
            padding: 20px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            text-align: left;
        }
        .receipt-header { 
            text-align: center; 
            border-bottom: 2px dashed #000; 
            padding-bottom: 10px; 
            margin-bottom: 10px;
        }
        .item-list { 
            list-style: none; 
            padding: 0; 
            margin: 0;
        }
        .item-list li { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 5px; 
        }
        .total-section {
            border-top: 2px dashed #000;
            margin-top: 10px;
            padding-top: 10px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 1.2em;
        }
    </style>
</head>
<body>

    <h1>🧾 영수증 제조기</h1>
    
    <div>
        <input type="text" id="itemName" placeholder="내용 (예: 퇴사 충동)">
        <input type="number" id="itemPrice" placeholder="비용 (숫자만)">
        <button onclick="addReceiptItem()">추가하기</button>
    </div>

    <div class="receipt-container" id="captureArea">
        <div class="receipt-header">
            <h2>MY RECEIPT</h2>
            <p>2026-05-27</p>
        </div>
        
        <ul class="item-list" id="receiptList">
            </ul>
        
        <div class="total-section">
            <span>TOTAL</span>
            <span id="totalAmount">0</span>
        </div>
    </div>

    <script>
        // [4] JavaScript 구역 (파이썬 app.py의 역할을 대신함!)
        let total = 0; // 총액을 저장할 변수

        function addReceiptItem() {
            // 사용자가 입력한 값 가져오기
            const name = document.getElementById('itemName').value;
            const price = parseInt(document.getElementById('itemPrice').value);

            // 입력값이 비어있거나 숫자가 아니면 경고창 띄우기
            if (!name || isNaN(price)) {
                alert("항목 이름과 비용을 정확히 입력해주세요!");
                return;
            }

            // 영수증 리스트에 새로운 항목(li) 만들어 넣기
            const ul = document.getElementById('receiptList');
            const li = document.createElement('li');
            li.innerHTML = `<span>${name}</span> <span>${price.toLocaleString()}</span>`;
            ul.appendChild(li);

            // 총액 계산해서 화면에 업데이트하기
            total += price;
            document.getElementById('totalAmount').innerText = total.toLocaleString();

            // 다음 입력을 위해 입력창 비우기
            document.getElementById('itemName').value = '';
            document.getElementById('itemPrice').value = '';
        }
    </script>
</body>
</html>
